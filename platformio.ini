[env:esp32s3]
platform = espressif32@6.7.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200

lib_ignore =
  ESPAsyncTCP
  ESPAsyncTCP-esphome
  ESPAsyncTCP-master

lib_deps =
  h2zero/NimBLE-Arduino@1.4.2
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
