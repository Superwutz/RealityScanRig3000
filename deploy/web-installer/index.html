<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RealityScanRig3000 Installer</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0e13;
      color: #e7eefc;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    .card {
      border: 1px solid #1b2333;
      border-radius: 14px;
      background: #0d1118;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }
    p, li {
      color: rgba(231, 238, 252, 0.82);
      line-height: 1.45;
    }
    code {
      background: #07090e;
      border: 1px solid #263149;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RealityScanRig3000 Firmware Installer</h1>
      <p>Install firmware via USB from your browser. No IDE required.</p>
      <p>
        <esp-web-install-button manifest="./manifest.json"></esp-web-install-button>
      </p>
    </div>

    <div class="card">
      <p><b>Requirements</b></p>
      <ul>
        <li>Chrome or Edge on desktop</li>
        <li>USB data cable</li>
        <li>Board in normal boot mode</li>
      </ul>
      <p>After first install, open <code>http://scanrig.local/</code> or use DHCP IP from your router.</p>
    </div>
  </div>
</body>
</html>
