name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-assets:
    name: Embedded web assets in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/webassets.py check

  firmware:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run

  ui-tests:
    name: UI smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve UI and run Playwright
        run: |
          python3 -m http.server 8080 --directory web &
          sleep 1
          UI_URL=http://127.0.0.1:8080 npx playwright test
